name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - build/android-apk-workflow
      - feature/supabase-username-auth-trial
      - feature/cafebazaar-poolakey-integration

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Configure JitPack for Poolakey
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/settings.gradle")
          content = path.read_text()
          marker = "dependencyResolutionManagement {"
          if marker not in content:
              raise SystemExit("Could not find dependencyResolutionManagement in android/settings.gradle")
          start = content.index(marker)
          repos_marker = "repositories {"
          repos_start = content.find(repos_marker, start)
          if repos_start < 0:
              raise SystemExit("Could not find repositories block in dependencyResolutionManagement")
          insert_at = repos_start + len(repos_marker)
          jitpack = "\n        maven { url = uri('https://jitpack.io') }"
          if "https://jitpack.io" not in content:
              content = content[:insert_at] + jitpack + content[insert_at:]
              path.write_text(content)
          print("JitPack repository configured for Poolakey")
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saisai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

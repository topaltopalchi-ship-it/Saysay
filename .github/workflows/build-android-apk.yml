name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/android-apk-workflow

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Ensure JitPack repository for CafeBazaar Poolakey
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          jitpack = "maven { url 'https://jitpack.io' }"
          settings = Path("android/settings.gradle")
          source = settings.read_text()
          if jitpack not in source:
              match = re.search(r'(dependencyResolutionManagement\s*\{[\s\S]*?repositories\s*\{)', source)
              if match:
                  source = source[:match.end()] + "\n        " + jitpack + source[match.end():]
                  settings.write_text(source)
              else:
                  raise SystemExit("Could not find dependencyResolutionManagement.repositories in android/settings.gradle")

          root = Path("android/build.gradle")
          if root.exists():
              source = root.read_text()
              if jitpack not in source:
                  match = re.search(r'(allprojects\s*\{[\s\S]*?repositories\s*\{)', source)
                  if match:
                      source = source[:match.end()] + "\n        " + jitpack + source[match.end():]
                      root.write_text(source)

          if jitpack not in settings.read_text():
              raise SystemExit("JitPack was not added to settings.gradle")
          print("JitPack repository is configured in Android dependency resolution.")
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saisai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

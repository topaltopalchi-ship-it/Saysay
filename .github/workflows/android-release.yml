name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: npm install

      - name: Build web
        env:
          VITE_CAFEBAZAAR_RSA_PUBLIC_KEY: ${{ secrets.CAFEBAZAAR_RSA_PUBLIC_KEY }}
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure JitPack repository for CafeBazaar Poolakey
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          jitpack = "maven { url 'https://jitpack.io' }"
          settings = Path("android/settings.gradle")
          source = settings.read_text() if settings.exists() else ""

          if "dependencyResolutionManagement" in source:
              start = source.index("dependencyResolutionManagement")
              match = re.search(r'repositories\s*\{', source[start:])
              if not match:
                  raise SystemExit("dependencyResolutionManagement exists but has no repositories block")
              pos = start + match.end()
              if jitpack not in source:
                  source = source[:pos] + "\n        " + jitpack + source[pos:]
                  settings.write_text(source)
          else:
              root = Path("android/build.gradle")
              root_source = root.read_text() if root.exists() else ""
              if jitpack not in root_source:
                  match = re.search(r'(allprojects\s*\{[\s\S]*?repositories\s*\{)', root_source)
                  if match:
                      root_source = root_source[:match.end()] + "\n        " + jitpack + root_source[match.end():]
                  else:
                      root_source += "\n\nallprojects {\n    repositories {\n        " + jitpack + "\n    }\n}\n"
                  root.write_text(root_source)

          print("JitPack repository configured for the generated Android project.")
          PY

      - name: Install icon dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install cairosvg Pillow

      - name: Restore Sai Sai launcher logo
        run: .venv/bin/python scripts/restore-android-icon.py

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD is missing" && exit 1)

      - name: Install release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/sai-sai-upload.jks
          chmod 600 android/app/sai-sai-upload.jks

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          signing = '''
              signingConfigs {
                  release {
                      storeFile file("sai-sai-upload.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''

          if "signingConfigs {" not in s:
              s, n = re.subn(
                  r"(^\s*buildTypes\s*\{)",
                  lambda m: signing + "\n" + m.group(1),
                  s,
                  count=1,
                  flags=re.M,
              )
              if n != 1:
                  raise SystemExit("Could not insert signingConfigs before buildTypes")

          if not re.search(
              r"buildTypes\s*\{\s*release\s*\{[^}]*signingConfig\s+signingConfigs\.release",
              s,
              flags=re.S,
          ):
              s, n = re.subn(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  s,
                  count=1,
              )
              if n != 1:
                  raise SystemExit("Could not configure release build type for signing")

          p.write_text(s)
          print("Release signing configuration installed.")
          PY

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/*.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: sai-sai-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sai-sai-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

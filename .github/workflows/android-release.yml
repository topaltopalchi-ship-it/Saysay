name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: npm install
      - name: Build web
        env:
          VITE_CAFEBAZAAR_RSA_PUBLIC_KEY: ${{ secrets.CAFEBAZAAR_RSA_PUBLIC_KEY }}
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Add JitPack repository for CafeBazaar Poolakey
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/build.gradle")
          source = path.read_text()
          jitpack = "maven { url 'https://jitpack.io' }"
          if jitpack not in source:
              source = source.replace("mavenCentral()", "mavenCentral()\n        " + jitpack)
              path.write_text(source)
          if jitpack not in path.read_text():
              raise SystemExit("Could not add JitPack repository to android/build.gradle")
          PY
      - name: Install icon dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install cairosvg Pillow
      - name: Restore Sai Sai launcher logo
        run: .venv/bin/python scripts/restore-android-icon.py
      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sai-sai-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sai-sai-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

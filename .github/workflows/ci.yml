name: Sayar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          echo "---BUILD-LOG---"
          cat build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

  android:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: npm install
      - name: Build web
        run: |
          set -o pipefail
          npm run build 2>&1 | tee android-build.log
      - name: Upload Android web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-web-build-log
          path: android-build.log
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure JitPack repository for CafeBazaar Poolakey
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          jitpack = "maven { url 'https://jitpack.io' }"
          settings = Path("android/settings.gradle")
          source = settings.read_text() if settings.exists() else ""

          # Prefer centralized dependency repositories when this Gradle template has them.
          if "dependencyResolutionManagement" in source:
              start = source.index("dependencyResolutionManagement")
              match = re.search(r'repositories\s*\{', source[start:])
              if not match:
                  raise SystemExit("dependencyResolutionManagement exists but has no repositories block")
              pos = start + match.end()
              if jitpack not in source:
                  source = source[:pos] + "\n        " + jitpack + source[pos:]
                  settings.write_text(source)
          else:
              # Older Capacitor templates keep dependency repositories in the root build.gradle.
              root = Path("android/build.gradle")
              root_source = root.read_text() if root.exists() else ""
              if jitpack not in root_source:
                  match = re.search(r'(allprojects\s*\{[\s\S]*?repositories\s*\{)', root_source)
                  if match:
                      root_source = root_source[:match.end()] + "\n        " + jitpack + root_source[match.end():]
                  else:
                      root_source += "\n\nallprojects {\n    repositories {\n        " + jitpack + "\n    }\n}\n"
                  root.write_text(root_source)

          print("JitPack repository configured for the generated Android project.")
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sai-sai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Sayar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          echo "---BUILD-LOG---"
          cat build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

  android:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: npm install
      - name: Build web
        run: |
          set -o pipefail
          npm run build 2>&1 | tee android-build.log
      - name: Upload Android web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-web-build-log
          path: android-build.log
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure JitPack repository for CafeBazaar Poolakey
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          jitpack = "maven { url 'https://jitpack.io' }"
          settings = Path("android/settings.gradle")
          source = settings.read_text()
          if jitpack not in source:
              match = re.search(r'(dependencyResolutionManagement\s*\{[\s\S]*?repositories\s*\{)', source)
              if match:
                  source = source[:match.end()] + "\n        " + jitpack + source[match.end():]
                  settings.write_text(source)
              else:
                  raise SystemExit("Could not find dependencyResolutionManagement.repositories in android/settings.gradle")

          root = Path("android/build.gradle")
          if root.exists():
              source = root.read_text()
              if jitpack not in source:
                  match = re.search(r'(allprojects\s*\{[\s\S]*?repositories\s*\{)', source)
                  if match:
                      source = source[:match.end()] + "\n        " + jitpack + source[match.end():]
                      root.write_text(source)

          if jitpack not in settings.read_text():
              raise SystemExit("JitPack was not added to settings.gradle")
          print("JitPack repository is configured in Android dependency resolution.")
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sai-sai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

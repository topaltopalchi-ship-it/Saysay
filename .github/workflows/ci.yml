name: Sayar CI

on:
  push:
    branches: [main, feature/cafebazaar-poolakey-integration]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  android:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: npm install
      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee android-build.log
      - name: Upload Android web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-web-build-log
          path: android-build.log
      - name: Generate Android project
        run: npx cap add android
      - name: Configure JitPack for Poolakey
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/build.gradle")
          content = path.read_text()
          if "https://jitpack.io" not in content:
              pattern = r"(allprojects\s*\{[\s\S]*?repositories\s*\{)"
              updated, count = re.subn(
                  pattern,
                  r"\1\n        maven { url 'https://jitpack.io' }",
                  content,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not locate allprojects repositories in android/build.gradle")
              path.write_text(updated)
          print("JitPack repository configured in android/build.gradle")
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure stable Android signing
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets are missing; refusing to create an APK with a temporary signing key."
            exit 1
          fi
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          app_gradle = Path("app/build.gradle")
          if not app_gradle.exists():
              app_gradle = Path("app/build.gradle.kts")
          if not app_gradle.exists():
              raise SystemExit("Could not find Android app Gradle build file")

          key_path = Path("app/saysay-release.jks")
          key_path.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=False))

          content = app_gradle.read_text()
          is_kts = app_gradle.suffix == ".kts"

          # Insert signingConfigs immediately before buildTypes, never inside another block.
          if "signingConfigs" not in content:
              if is_kts:
                  signing = '''
          signingConfigs {
              create("release") {
                  storeFile = file("saysay-release.jks")
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          '''
              else:
                  signing = '''
          signingConfigs {
              release {
                  storeFile file("saysay-release.jks")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          '''
              marker = "buildTypes {"
              pos = content.find(marker)
              if pos < 0:
                  raise SystemExit("Could not find buildTypes block to configure release signing")
              content = content[:pos] + signing + content[pos:]

          # Locate buildTypes first, then only the release block nested after it.
          bt = content.find("buildTypes")
          if bt < 0:
              raise SystemExit("Could not find buildTypes block")
          rel = content.find('getByName("release") {', bt) if is_kts else content.find("release {", bt)
          if rel < 0:
              raise SystemExit("Could not find release build type")
          # Refuse to edit a release block if a signingConfig is already present in that block.
          open_brace = content.find("{", rel)
          depth = 0
          close_brace = -1
          for i in range(open_brace, len(content)):
              if content[i] == "{":
                  depth += 1
              elif content[i] == "}":
                  depth -= 1
                  if depth == 0:
                      close_brace = i
                      break
          if close_brace < 0:
              raise SystemExit("Could not parse release build type block")
          release_body = content[open_brace+1:close_brace]
          if "signingConfig" not in release_body:
              line = '\n        signingConfig = signingConfigs.getByName("release")\n' if is_kts else '\n        signingConfig signingConfigs.release\n'
              content = content[:close_brace] + line + content[close_brace:]
          app_gradle.write_text(content)
          print("Configured stable release signing in the buildTypes.release block.")
          PY
      - name: Verify keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore app/saysay-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS"
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: sai-sai-release-apk
          path: android/app/build/outputs/apk/release/*.apk

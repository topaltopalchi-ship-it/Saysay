name: Build Standalone Bazaar AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master, release/bazaar ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_CAFEBAZAAR_RSA_PUBLIC_KEY: ${{ secrets.CAFEBAZAAR_RSA_PUBLIC_KEY }}
        run: npm run build

      - name: Add Android platform if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Android camera permission for barcode scanning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found after Capacitor sync")
          source = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          if "android.permission.CAMERA" not in source:
              source, count = re.subn(r"(<manifest\b[^>]*>)", lambda match: match.group(1) + "\n    " + permission, source, count=1)
              if count != 1:
                  raise SystemExit("Could not locate manifest root to add camera permission")
          feature = '<uses-feature android:name="android.hardware.camera" android:required="false" />'
          if "android.hardware.camera" not in source:
              source, count = re.subn(r"(<manifest\b[^>]*>)", lambda match: match.group(1) + "\n    " + feature, source, count=1)
              if count != 1:
                  raise SystemExit("Could not locate manifest root to add optional camera feature")
          if "android.permission.CAMERA" not in source or "<manifest" not in source:
              raise SystemExit("Could not add camera permission to Android manifest")
          manifest.write_text(source)
          print("Camera permission is present in AndroidManifest.xml")
          PY

      - name: Install native Vosk speech recognition
        run: python3 scripts/setup-vosk-android.py

      - name: Ensure JitPack repository for CafeBazaar Poolakey
        run: |
          python3 - <<'PY'
          from pathlib import Path

          jitpack = "maven { url 'https://jitpack.io' }"
          settings = Path("android/settings.gradle")
          if not settings.exists():
              settings = Path("android/settings.gradle.kts")

          if settings.exists():
              source = settings.read_text()
              if jitpack not in source:
                  management = source.find("dependencyResolutionManagement")
                  if management >= 0:
                      repos = source.find("repositories", management)
                      brace = source.find("{", repos)
                      if repos < 0 or brace < 0:
                          raise SystemExit("Could not find dependency repositories in settings")
                      source = source[:brace + 1] + "\\n        " + jitpack + source[brace + 1:]
                      settings.write_text(source)
                  else:
                      root = Path("android/build.gradle")
                      root_source = root.read_text()
                      root_source += "\\n\\nallprojects { repositories { " + jitpack + " } }\\n"
                      root.write_text(root_source)
          print("JitPack repository configured for the generated Android project.")
          PY

      - name: Install Android icon rendering dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --no-cache-dir cairosvg Pillow
          .venv/bin/python -c "import cairosvg; from PIL import Image; print('Icon dependencies ready')"

      - name: Restore Sai Sai launcher logo
        run: .venv/bin/python scripts/restore-android-icon.py

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD is missing" && exit 1)

      - name: Install release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/sai-sai-upload.jks
          chmod 600 android/app/sai-sai-upload.jks

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("sai-sai-upload.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs {" not in s:
              s, n = re.subn(r"(^\\s*buildTypes\\s*\\{)", lambda m: signing + "\\n" + m.group(1), s, count=1, flags=re.M)
              if n != 1:
                  raise SystemExit("Could not insert signingConfigs before buildTypes")
          if not re.search(r"buildTypes\\s*\\{\\s*release\\s*\\{[^}]*signingConfig\\s+signingConfigs\\.release", s, flags=re.S):
              s, n = re.subn(r"(buildTypes\\s*\\{\\s*release\\s*\\{)", r"\\1\\n            signingConfig signingConfigs.release", s, count=1)
              if n != 1:
                  raise SystemExit("Could not configure release build type for signing")
          p.write_text(s)
          print("Release signing configuration installed.")
          PY

      - name: Set new Bazaar version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('android/app/build.gradle')
          if not p.exists():
              p = Path('android/app/build.gradle.kts')
          if not p.exists():
              raise SystemExit('Android app Gradle file not found')
          s = p.read_text()
          start = s.find('defaultConfig')
          if start < 0:
              raise SystemExit('defaultConfig block not found in ' + str(p))
          brace = s.find('{', start)
          if brace < 0:
              raise SystemExit('Opening brace for defaultConfig not found')
          package = __import__('json').loads(Path('package.json').read_text())
          version_name = package.get('version')
          if not version_name:
              raise SystemExit('package.json version is missing')
          version_code = 100000 + int(os.environ['RUN_NUMBER'])
          import re
          s = re.sub(r'(?m)^\\s*versionCode\\s*(?:=\\s*)?\\d+\\s*$', '', s)
          s = re.sub(r'(?m)^\\s*versionName\\s*(?:=\\s*)?["\\'][^"\\']+["\\']\\s*$', '', s)
          insertion = '\\n        versionCode ' + str(version_code) + '\\n        versionName "' + version_name + '"\\n'
          s = s[:brace + 1] + insertion + s[brace + 1:]
          p.write_text(s)
          print('Bazaar versionName=' + version_name + ', versionCode=' + str(version_code))
          PY

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/*.aab

      - name: Download CafeBazaar bundle-signer
        run: |
          set -euo pipefail
          RELEASE_JSON=$(curl --fail --silent --show-error https://api.github.com/repos/cafebazaar/bundle-signer/releases/latest)
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x["browser_download_url"] for x in d["assets"] if x["name"].endswith(".jar") and "signer" in x["name"].lower()]; print(a[0] if a else "")')
          test -n "$ASSET_URL" || (echo "Could not find bundle-signer JAR in latest official release" && exit 1)
          curl --fail --location --silent --show-error "$ASSET_URL" --output /tmp/bundlesigner.jar
          test -s /tmp/bundlesigner.jar

      - name: Generate CafeBazaar BIN
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB=$(find android/app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)
          test -n "$AAB"
          java -jar /tmp/bundlesigner.jar genbin \\
            --v2-signing-enabled true \\
            --v3-signing-enabled false \\
            --bundle "$AAB" \\
            --bin android/app/build/outputs/bundle/release/ \\
            --ks android/app/sai-sai-upload.jks \\
            --ks-pass "pass:$KEYSTORE_PASSWORD" \\
            --ks-key-alias "$KEY_ALIAS" \\
            --key-pass "pass:$KEY_PASSWORD"
          find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.bin' -print -quit | grep -q .

      - name: Upload signed AAB and CafeBazaar BIN
        uses: actions/upload-artifact@v4
        with:
          name: SaySai-Bazaar-AAB-and-BIN
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/*.bin
          if-no-files-found: error
          retention-days: 30

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bazaar-build-${{ github.run_number }}
          name: SaySai v${{ steps.app_version.outputs.version }} (Bazaar build ${{ github.run_number }})
          generate_release_notes: true
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/*.bin

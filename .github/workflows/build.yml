name: Build check

on:
  pull_request:
  push:
    branches:
      - main
      - feature/monthly-subscription-foundation
      - feature/email-auth-integration

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
